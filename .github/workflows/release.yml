name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build release artifacts
        run: gradle -PgithubReleaseTag=${GITHUB_REF_NAME} buildReleaseArtifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DataNet.txt
            release/DataNet.zip
            release/DataNet.pdex
